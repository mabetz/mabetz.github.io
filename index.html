		var CHART_WIDTH = 500;
		var CHART_HEIGHT = 500;

		var svg1 = d3.select('#main')

      // then, create the zoom behvavior
      var zoom = d3.behavior.zoom()
        // only scale up, e.g. between 1x and 50x
        .scaleExtent([1, 50])
        .on("zoom", function() {
          // the "zoom" event populates d3.event with an object that has
          // a "translate" property (a 2-element Array in the form [x, y])
          // and a numeric "scale" property
          var e = d3.event,
              // now, constrain the x and y components of the translation by the
              // dimensions of the viewport
              tx = Math.min(0, Math.max(e.translate[0], CHART_WIDTH - CHART_WIDTH * e.scale)),
              ty = Math.min(0, Math.max(e.translate[1], CHART_HEIGHT - CHART_HEIGHT * e.scale));
          // then, update the zoom behavior's internal translation, so that
          // it knows how to properly manipulate it on the next movement
          zoom.translate([tx, ty]);
          // and finally, update the <g> element's transform attribute with the
          // correct translation and scale (in reverse order)
          g_streetB.attr("transform", [
            "translate(" + [tx, ty] + ")",
            "scale(" + e.scale + ")"
          ].join(" "));

					g_streetU.attr("transform", [
						"translate(" + [tx, ty] + ")",
						"scale(" + e.scale + ")"
					].join(" "));

					g_pumps.attr("transform", [
						"translate(" + [tx, ty] + ")",
						"scale(" + e.scale + ")"
					].join(" "));

					g_deaths.attr("transform", [
						"translate(" + [tx, ty] + ")",
						"scale(" + e.scale + ")"
					].join(" "));
        });

      // then, call the zoom behavior on the svg element, which will add
      // all of the necessary mouse and touch event handlers.
      // remember that if you call this on the <g> element, the even handlers
      // will only trigger when the mouse or touch cursor intersects with the
      // <g> elements' children!
      svg1.call(zoom);

		function drawScatterPlot()
			{
				var xScale = d3.scale.linear();
				var yScale = d3.scale.linear();

				xScale.domain([3.3900001, 19.9120007]).range([0, CHART_WIDTH]);

				yScale.domain( [3.2349999, 18.7250004] ).range( [CHART_HEIGHT,0] );

	    		g_pumps.selectAll('circle')
	    			.data(pumps)
	    			.enter()
	    			.append('circle')
	    			.style('fill', 'black')
	    			.attr('r', 10)
	    			.attr('cx', function(d) { return xScale(d.x)})
	    			.attr('cy', function(e){return yScale(e.y)});


						g_deaths.selectAll('circle')
							.data(deathdata)
							.enter()
							.append('circle')
							.style('fill', 'red')
							.style('stroke', 'black')
							.attr('r', 2)
							.attr('cx', function(d) { return xScale(d.x)})
							.attr('cy', function(e){return yScale(e.y)});

			}

// Importing the csv file that contains the x and y coordinates, age, gender, and date of death for each subject
// There are 571 subjects
		d3.csv("deaths_age_sex_date.csv" , function(data) {
		data.forEach(function(d) {
			var object = {
				x : d.x,
				y : d.y ,
				age: d.age ,
				gender : d.gender ,
				date : d.date,
		 		time : +d.time
			};
		 deathdata.push(object)
		});
		console.log(data[0]);
//		drawBarChart()

});

// Importing the csv file that contains pump x and y coordinates
// There are 13 pumps subjects
		d3.csv("pumps.csv" , function(data) {
		data.forEach(function(d) {
			var object = {
				x : +d.x ,
			 	y : +d.y
			};

			pumps.push(object)
		});
		console.log(data[0]);
		drawScatterPlot();
});


// STREETS ON Maps
function drawLineChart()
{
				maxValueX = d3.max(streetdata, function(d) {
					return d3.max(d, function(d) {
						return d["x"];
					});
				});

				minValueX = d3.min(streetdata, function(d) {
					return d3.min(d, function(d) {
						return d["x"];
					});
				});

				maxValueY = d3.max(streetdata, function(d) {
					return d3.max(d, function(d) {
						return d["y"];
					});
				});

				minValueY = d3.min(streetdata, function(d) {
					return d3.min(d, function(d) {
						return d["y"];
					});
				});

				var xScale = d3.scale.linear();
				var yScale = d3.scale.linear();

				xScale.domain([minValueX, maxValueX]).range([0, CHART_WIDTH]);

				yScale.domain( [minValueY, maxValueY] ).range( [CHART_HEIGHT,0] );
//pathGenerator makes one line that connects all data points
	var pathGenerator = d3.svg.line()
		.x(function(d) { return xScale(d.x); })
		.y(function(d) { return yScale(d.y); });

		var yAxis = d3.svg.axis()
			.scale(yScale)
			.orient('left');

		g_streetB.selectAll('path').data(streetdata).enter().append('path')
			.attr('d', function (d){return pathGenerator(d)} )
			.style('fill', 'none')
			.style('stroke', 'steelblue')
			.style('stroke-linecap', "round")
			.style('stroke-width', '5px')
			;

		g_streetU.selectAll('path').data(streetdata).enter().append('path')
				.attr('d', function (d){return pathGenerator(d)} )
				.style('fill', 'none')
				.style('stroke', 'white')
				.style('stroke-linecap', "round")
				.style('stroke-width', '2px')
				;

}


// Importing the json file that contains street x and y coordinates
d3.json("streets.json", function(streets) {
			streetdata = streets;
			drawLineChart()
});
